{{#post}}
<article class="post">
  <header class="post-header">
    <p class="post-meta"><time datetime="{{dateIso}}">{{dateLabel}}</time></p>
    <h1 class="post-title">{{title}}</h1>
    {{#hasTags}}
    <ul class="tag-list">
      {{#tags}}<li><a href="{{url}}">#{{name}}</a></li>{{/tags}}
    </ul>
    {{/hasTags}}
  </header>
  <div class="post-body">
    {{{bodyHtml}}}
  </div>
</article>
{{/post}}
<nav class="post-nav" aria-label="前後の記事">
  {{#newer}}<a href="{{url}}" class="post-nav-newer"><span>新しい記事</span>{{title}}</a>{{/newer}}
  {{#older}}<a href="{{url}}" class="post-nav-older"><span>古い記事</span>{{title}}</a>{{/older}}
</nav>
