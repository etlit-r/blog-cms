name: CI / Deploy

# - プルリクエスト: 型チェック・テスト・ビルドだけを行う
# - main への push: 上記がすべて通ったら Cloudflare にデプロイする
# - 手動実行 (Actions タブの "Run workflow"): main ブランチならデプロイまで行う
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 型チェック・テスト・ビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    name: Cloudflare へデプロイ
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # 同時に 2 つのデプロイが走らないようにする（後から来たものは前のものの完了を待つ）
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://etlits.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 設定の確認
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::GitHub の Secrets に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を登録してください（README の「GitHub Actions でのデプロイ」を参照）"
            exit 1
          fi
          if grep -q '"database_id": "00000000-0000-0000-0000-000000000000"' wrangler.jsonc; then
            echo "::error::wrangler.jsonc の database_id が初期値のままです。D1 データベースを作成し、その ID に書き換えてください"
            exit 1
          fi

      - run: npm ci

      # 管理画面のビルド → 本番 D1 へのマイグレーション → Worker のデプロイ
      - run: npm run deploy
