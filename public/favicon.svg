<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 逆さまの静けさ: 水面に映った、上下が逆さまの三日月 -->
  <defs>
    <mask id="crescent">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="39" cy="25" r="13" fill="#000"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="#08090d"/>
  <!-- 上向きの三日月（右上が欠ける）を、中心の高さで上下に反転する -->
  <g transform="translate(0 64) scale(1 -1)">
    <circle cx="30" cy="32" r="16" fill="#2f8bff" mask="url(#crescent)"/>
  </g>
</svg>
